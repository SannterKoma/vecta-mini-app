<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vecta AI</title>
    <!-- Подключаем технологичный шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --primary-color: #00f3ff;
            --secondary-color: #1f2833;
            --text-color: #e0e0e0;
            --glass-bg: rgba(0, 243, 255, 0.08);
            --user-msg-bg: rgba(0, 243, 255, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif; /* Технологичный шрифт */
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.03) 0%, transparent 70%);
        }

        /* --- МОРОДОЧКА ВЕКТЫ --- */
        .face-container {
            height: 160px; /* Компактнее для мобилок */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        svg.face {
            width: 100px;
            height: 100px;
            filter: drop-shadow(0 0 15px var(--primary-color));
            transition: all 0.3s ease;
        }

        /* Глаза */
        .eye {
            fill: var(--primary-color);
            transition: all 0.1s ease;
        }

        /* Рот */
        .mouth {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 3;
            stroke-linecap: round;
            transition: d 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Состояния мордочки */
        .face.thinking .eye {
            transform: scaleY(1.5); /* Удивленные/внимательные глаза */
            transform-origin: center;
        }
        
        .face.happy .mouth {
            d: path("M 30 65 Q 50 80 70 65"); /* Улыбка */
        }

        .face.blink .eye {
            transform: scaleY(0.1); /* Моргание */
            transform-origin: center;
        }

        /* --- ЧАТ --- */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px; /* Уменьшенный отступ */
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            word-wrap: break-word;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            border: 1px solid rgba(0, 243, 255, 0.4);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 2px;
        }

        /* Индикатор печати */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: var(--glass-bg);
            padding: 8px 14px;
            border-radius: 12px;
            border-bottom-left-radius: 2px;
            margin-bottom: 5px;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--primary-color);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* --- ПАНЕЛЬ ВВОДА --- */
        .input-panel {
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            background: rgba(11, 12, 16, 0.95);
            border-top: 1px solid rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .input-panel input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 20px;
            padding: 10px 18px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-panel input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            background: rgba(0, 243, 255, 0.05);
        }

        .btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--primary-color);
            color: var(--bg-color);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .btn:active { transform: scale(0.9); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Скроллбар */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- ВЕКТОРНАЯ МОРДОЧКА -->
    <div class="face-container">
        <svg class="face" id="vectaFace" viewBox="0 0 100 100">
            <!-- Левый глаз -->
            <ellipse class="eye" cx="35" cy="45" rx="8" ry="10" />
            <!-- Правый глаз -->
            <ellipse class="eye" cx="65" cy="45" rx="8" ry="10" />
            <!-- Рот (нейтральный) -->
            <path class="mouth" d="M 35 70 Q 50 70 65 70" />
            
            <!-- Декоративные элементы (уши/антенны) -->
            <circle cx="15" cy="50" r="3" fill="none" stroke="var(--primary-color)" stroke-width="2" opacity="0.5"/>
            <circle cx="85" cy="50" r="3" fill="none" stroke="var(--primary-color)" stroke-width="2" opacity="0.5"/>
        </svg>
    </div>

    <!-- ЧАТ -->
    <div class="chat-history" id="chatHistory">
        <div class="message ai">Системы онлайн. Я Векта. Готова к работе.</div>
    </div>

    <!-- ИНДИКАТОР ПЕЧАТИ -->
    <div class="typing-indicator" id="typingIndicator">
        <span></span><span></span><span></span>
    </div>

    <!-- ВВОД -->
    <div class="input-panel">
        <input type="text" id="userInput" placeholder="Команда..." autocomplete="off">
        <button class="btn" id="sendBtn"></button>
    </div>

    <script>
        const chatHistory = document.getElementById('chatHistory');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const face = document.getElementById('vectaFace');
        const typingIndicator = document.getElementById('typingIndicator');

        const BACKEND_URL = 'http://localhost:8000';
        let isProcessing = false;

        // --- ЛОГИКА МОРДОЧКИ ---
        function setExpression(state) {
            face.classList.remove('thinking', 'happy', 'blink');
            if (state) face.classList.add(state);
        }

        // Автоматическое моргание
        setInterval(() => {
            if (!isProcessing && Math.random() > 0.7) {
                setExpression('blink');
                setTimeout(() => setExpression(null), 150);
            }
        }, 3000);

        // --- ЧАТ И ЛОГИКА ---
        function addMessage(text, sender) {
            const msg = document.createElement('div');
            msg.classList.add('message', sender);
            msg.textContent = text;
            chatHistory.appendChild(msg);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function showTyping(show) {
            typingIndicator.style.display = show ? 'block' : 'none';
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isProcessing) return;

            isProcessing = true;
            sendBtn.disabled = true;
            
            addMessage(text, 'user');
            userInput.value = '';
            
            // Векта "думает"
            setExpression('thinking');
            showTyping(true);

            try {
                const response = await fetch(`${BACKEND_URL}/api/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: 'user', text: text })
                });

                const data = await response.json();
                
                // Векта "радуется" и отвечает
                setExpression('happy');
                showTyping(false);
                addMessage(data.ai_response, 'ai');
                
                // Возврат к нейтральному состоянию через секунду
                setTimeout(() => {
                    if (!isProcessing) setExpression(null);
                }, 2000);

            } catch (error) {
                showTyping(false);
                setExpression(null);
                addMessage('Ошибка связи с сервером.', 'ai');
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        
        // Фокус на поле ввода при загрузке
        userInput.focus();
    </script>
</body>
</html>
