<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vecta AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0e0a;
            --sidebar-bg: rgba(13, 18, 13, 0.6);
            --primary-color: #39ff14;
            --primary-dim: rgba(57, 255, 20, 0.3);
            --text-color: #e0e0e0;
            --glass-bg: rgba(57, 255, 20, 0.06);
            --glass-border: rgba(57, 255, 20, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.08);
            --user-msg-bg: rgba(57, 255, 20, 0.12);
            --border-color: rgba(57, 255, 20, 0.2);
            --mic-active: #ff4757;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(57, 255, 20, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(57, 255, 20, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(57, 255, 20, 0.06) 0%, transparent 50%),
                var(--bg-color);
        }

        /* --- БОКОВАЯ ПАНЕЛЬ (Liquid Glass) --- */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
            box-shadow: 5px 0 20px rgba(0, 0, 0, 0.3);
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(57, 255, 20, 0.03);
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }

        .btn-new-chat {
            background: rgba(57, 255, 20, 0.15);
            backdrop-filter: blur(10px);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-new-chat:hover {
            background: rgba(57, 255, 20, 0.25);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .group-title {
            font-size: 11px;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 10px 8px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0.8;
        }

        .btn-add-group {
            background: rgba(57, 255, 20, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 0;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            margin-bottom: 2px;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.02);
        }

        .chat-item:hover {
            background: rgba(57, 255, 20, 0.08);
            border-color: var(--glass-border);
            backdrop-filter: blur(5px);
        }

        .chat-item.active {
            background: rgba(57, 255, 20, 0.12);
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
        }

        .chat-item-name {
            flex: 1;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item-actions {
            display: none;
            gap: 4px;
        }

        .chat-item:hover .chat-item-actions {
            display: flex;
        }

        .chat-action-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 5px;
            opacity: 0.6;
            transition: 0.2s;
        }

        .chat-action-btn:hover {
            opacity: 1;
            color: var(--primary-color);
        }

        .chat-action-btn.delete:hover {
            color: #ff4757;
        }

        /* --- ОСНОВНАЯ ОБЛАСТЬ --- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .top-bar {
            padding: 10px 15px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(13, 18, 13, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .btn-toggle-sidebar {
            background: rgba(57, 255, 20, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--primary-color);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            display: none;
        }

        .current-chat-title {
            font-size: 16px;
            color: var(--primary-color);
            font-weight: 600;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.3);
        }

        /* --- ДАТА/ВРЕМЯ --- */
        .datetime-display {
            text-align: center;
            padding: 15px 0 10px;
            font-size: 13px;
            color: var(--primary-color);
            opacity: 0.7;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* --- НАЗВАНИЕ VECTA AI (крупнее, по центру) --- */
        .vecta-title {
            text-align: center;
            padding: 10px 0 20px;
            font-size: 32px;
            color: var(--primary-color);
            opacity: 0.9;
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.6), 0 0 40px rgba(57, 255, 20, 0.3);
        }

        /* --- РОБОТ --- */
        .robot-container {
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        svg.robot {
            width: 220px;
            height: 150px;
        }

        .frame {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 2;
            animation: frame-pulse 2.5s ease-in-out infinite;
        }

        @keyframes frame-pulse {
            0%, 100% {
                stroke-opacity: 0.4;
                filter: drop-shadow(0 0 4px var(--primary-color));
            }
            50% {
                stroke-opacity: 1;
                filter: drop-shadow(0 0 12px var(--primary-color));
            }
        }

        .eye-shape {
            fill: var(--primary-color);
            filter: drop-shadow(0 0 6px var(--primary-color));
            transition: d 0.3s ease;
        }

        /* Эмоции */
        .robot.happy .eye-left { d: path("M 55 95 Q 65 85 75 95"); }
        .robot.happy .eye-right { d: path("M 105 95 Q 115 85 125 95"); }
        
        .robot.sad .eye-left { d: path("M 55 105 Q 65 115 75 105"); }
        .robot.sad .eye-right { d: path("M 105 105 Q 115 115 125 105"); }
        
        .robot.angry .eye-left { d: path("M 50 100 L 75 92 L 78 102 Z"); }
        .robot.angry .eye-right { d: path("M 130 100 L 105 92 L 102 102 Z"); }
        
        .robot.surprised .eye-left { d: path("M 60 88 A 10 10 0 1 0 80 108 A 10 10 0 1 0 60 88"); }
        .robot.surprised .eye-right { d: path("M 110 88 A 10 10 0 1 0 130 108 A 10 10 0 1 0 110 88"); }
        
        .robot.sleepy .eye-left { d: path("M 55 100 L 75 100"); stroke: var(--primary-color); stroke-width: 5; fill: none; }
        .robot.sleepy .eye-right { d: path("M 105 100 L 125 100"); stroke: var(--primary-color); stroke-width: 5; fill: none; }
        
        .robot.love .eye-left { d: path("M 65 92 C 65 87, 57 87, 57 94 C 57 101, 65 106, 65 106 C 65 106, 73 101, 73 94 C 73 87, 65 87, 65 92"); }
        .robot.love .eye-right { d: path("M 115 92 C 115 87, 107 87, 107 94 C 107 101, 115 106, 115 106 C 115 106, 123 101, 123 94 C 123 87, 115 87, 115 92"); }
        
        .robot.confused .eye-left { d: path("M 58 88 A 8 10 0 1 0 74 108 A 8 10 0 1 0 58 88"); }
        .robot.confused .eye-right { d: path("M 108 94 A 10 8 0 1 0 128 110 A 10 8 0 1 0 108 94"); }
        
        .robot.excited .eye-left { d: path("M 65 85 L 68 95 L 78 95 L 70 101 L 73 111 L 65 105 L 57 111 L 60 101 L 52 95 L 62 95 Z"); }
        .robot.excited .eye-right { d: path("M 115 85 L 118 95 L 128 95 L 120 101 L 123 111 L 115 105 L 107 111 L 110 101 L 102 95 L 112 95 Z"); }
        
        .robot.scared .eye-left { d: path("M 58 88 A 12 12 0 1 0 82 112 A 12 12 0 1 0 58 88"); }
        .robot.scared .eye-right { d: path("M 108 88 A 12 12 0 1 0 132 112 A 12 12 0 1 0 108 88"); }
        
        .robot.cool .eye-left { d: path("M 55 100 L 78 100 L 75 106 L 58 106 Z"); }
        .robot.cool .eye-right { d: path("M 102 100 L 125 100 L 122 106 L 105 106 Z"); }
        
        .robot.blink .eye-shape { transform: scaleY(0.1); transform-origin: center; }

        /* --- ЧАТ (Liquid Glass) --- */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.4;
            animation: popIn 0.3s ease;
            word-wrap: break-word;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            border: 1px solid rgba(57, 255, 20, 0.3);
            color: #fff;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 15px rgba(57, 255, 20, 0.15);
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(57, 255, 20, 0.05);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 2px;
        }

        .typing-indicator {
            display: none;
            align-self: center;
            background: rgba(57, 255, 20, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            margin: 5px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1.4s infinite ease-in-out both;
            box-shadow: 0 0 8px var(--primary-color);
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* --- ПАНЕЛЬ ВВОДА (Liquid Glass) --- */
        .input-panel {
            padding: 12px 15px;
            display: flex;
            gap: 10px;
            background: rgba(10, 14, 10, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid var(--glass-border);
            align-items: center;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.3);
        }

        .input-panel input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 12px 20px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-panel input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
            background: rgba(57, 255, 20, 0.05);
        }

        /* Минималистичные кнопки */
        .btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--primary-color);
            background: rgba(57, 255, 20, 0.08);
            backdrop-filter: blur(10px);
            color: var(--primary-color);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            opacity: 0.8;
            padding: 0;
        }

        .btn:hover {
            opacity: 1;
            background: rgba(57, 255, 20, 0.15);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
        }

        .btn:active { transform: scale(0.9); }
        .btn:disabled { opacity: 0.3; }

        .btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--primary-color);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-mic.recording {
            background: var(--mic-active);
            border-color: var(--mic-active);
            opacity: 1;
            animation: mic-pulse 1s infinite;
        }

        .btn-mic.recording svg {
            stroke: white;
        }

        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }

        /* --- МОДАЛЬНОЕ ОКНО (Liquid Glass) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: rgba(13, 18, 13, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--primary-color);
            border-radius: 16px;
            padding: 25px;
            min-width: 320px;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.3), 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal h3 {
            margin: 0 0 15px;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }

        .modal input, .modal select {
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            transition: 0.3s;
        }

        .modal input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            transition: 0.2s;
        }

        .modal-btn.primary {
            background: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }

        .modal-btn.primary:hover {
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.6);
        }

        .modal-btn.secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            backdrop-filter: blur(10px);
        }

        .modal-btn.secondary:hover {
            background: rgba(255,255,255,0.1);
        }

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .btn-toggle-sidebar { display: block; }
            .vecta-title { font-size: 28px; letter-spacing: 6px; }
        }
    </style>
</head>
<body>

    <!-- БОКОВАЯ ПАНЕЛЬ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Vecta</h2>
            <button class="btn-new-chat" id="btnNewChat">+ Новый</button>
        </div>
        <div class="chats-list" id="chatsList"></div>
    </aside>

    <!-- ОСНОВНАЯ ОБЛАСТЬ -->
    <main class="main">
        <div class="top-bar">
            <button class="btn-toggle-sidebar" id="btnToggleSidebar">☰</button>
            <div class="current-chat-title" id="currentChatTitle">Новый чат</div>
        </div>

        <!-- Дата и время -->
        <div class="datetime-display" id="datetimeDisplay"></div>

        <!-- Название VECTA AI (крупнее, по центру между датой и роботом) -->
        <div class="vecta-title">VECTA AI</div>

        <div class="robot-container">
            <svg class="robot" id="vectaRobot" viewBox="0 0 180 140">
                <rect class="frame" x="20" y="20" width="140" height="100" rx="18"/>
                <path class="eye-shape eye-left" d="M 60 55 A 12 12 0 1 0 84 79 A 12 12 0 1 0 60 55"/>
                <path class="eye-shape eye-right" d="M 96 55 A 12 12 0 1 0 120 79 A 12 12 0 1 0 96 55"/>
            </svg>
        </div>

        <div class="chat-history" id="chatHistory">
            <div class="message ai">Системы онлайн. Я Векта. Готова к работе.</div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>

        <div class="input-panel">
            <input type="text" id="userInput" placeholder="Команда..." autocomplete="off">
            <button class="btn btn-mic" id="micBtn" title="Голосовой ввод">
                <svg viewBox="0 0 24 24">
                    <rect x="9" y="2" width="6" height="12" rx="3"/>
                    <path d="M 5 11 A 7 7 0 0 0 19 11"/>
                    <line x1="12" y1="18" x2="12" y2="22"/>
                    <line x1="8" y1="22" x2="16" y2="22"/>
                </svg>
            </button>
            <button class="btn" id="sendBtn" title="Отправить">
                <svg viewBox="0 0 24 24">
                    <path d="M 22 2 L 11 13"/>
                    <path d="M 22 2 L 15 22 L 11 13 L 2 9 Z"/>
                </svg>
            </button>
        </div>
    </main>

    <!-- МОДАЛКИ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <script>
        // ====== ХРАНИЛИЩЕ ======
        const STORAGE_KEY = 'vecta_chats_v1';
        
        let state = {
            chats: [],
            groups: [{ id: 'default', name: 'Общие' }],
            currentChatId: null
        };

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                state = JSON.parse(saved);
            }
            if (!state.currentChatId || !state.chats.find(c => c.id === state.currentChatId)) {
                createNewChat('Новый чат');
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function createNewChat(name = 'Новый чат', groupId = 'default') {
            const chat = {
                id: 'chat_' + Date.now(),
                name: name,
                group: groupId,
                messages: [],
                created: new Date().toISOString()
            };
            state.chats.push(chat);
            state.currentChatId = chat.id;
            saveState();
            return chat;
        }

        function getCurrentChat() {
            return state.chats.find(c => c.id === state.currentChatId);
        }

        // ====== UI ======
        const chatHistory = document.getElementById('chatHistory');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const robot = document.getElementById('vectaRobot');
        const typingIndicator = document.getElementById('typingIndicator');
        const chatsList = document.getElementById('chatsList');
        const currentChatTitle = document.getElementById('currentChatTitle');
        const sidebar = document.getElementById('sidebar');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');
        const datetimeDisplay = document.getElementById('datetimeDisplay');

        const BACKEND_URL = 'http://localhost:8000';
        let isProcessing = false;

        // Обновление даты и времени
        function updateDateTime() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            datetimeDisplay.textContent = now.toLocaleDateString('ru-RU', options);
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();

        function renderChatsList() {
            chatsList.innerHTML = '';
            
            state.groups.forEach(group => {
                const groupChats = state.chats.filter(c => c.group === group.id);
                if (groupChats.length === 0) return;
                
                const groupEl = document.createElement('div');
                groupEl.className = 'group-title';
                groupEl.innerHTML = `
                    <span>${group.name}</span>
                    <button class="btn-add-group" data-group="${group.id}" title="Новый чат в группе">+</button>
                `;
                chatsList.appendChild(groupEl);
                
                groupChats.forEach(chat => {
                    const item = document.createElement('div');
                    item.className = 'chat-item' + (chat.id === state.currentChatId ? ' active' : '');
                    item.innerHTML = `
                        <span class="chat-item-name">${escapeHtml(chat.name)}</span>
                        <div class="chat-item-actions">
                            <button class="chat-action-btn rename" data-id="${chat.id}" title="Переименовать"></button>
                            <button class="chat-action-btn delete" data-id="${chat.id}" title="Удалить">✕</button>
                        </div>
                    `;
                    item.addEventListener('click', (e) => {
                        if (e.target.closest('.chat-action-btn')) return;
                        switchChat(chat.id);
                    });
                    chatsList.appendChild(item);
                });
            });

            document.querySelectorAll('.btn-add-group').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const groupId = btn.dataset.group;
                    const chat = createNewChat('Новый чат', groupId);
                    renderChatsList();
                    switchChat(chat.id);
                });
            });

            document.querySelectorAll('.chat-action-btn.rename').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openRenameModal(btn.dataset.id);
                });
            });

            document.querySelectorAll('.chat-action-btn.delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteChat(btn.dataset.id);
                });
            });
        }

        function switchChat(chatId) {
            state.currentChatId = chatId;
            saveState();
            renderChatsList();
            renderMessages();
            const chat = getCurrentChat();
            currentChatTitle.textContent = chat ? chat.name : 'Новый чат';
            if (window.innerWidth <= 768) sidebar.classList.remove('open');
        }

        function renderMessages() {
            chatHistory.innerHTML = '';
            const chat = getCurrentChat();
            if (!chat || chat.messages.length === 0) {
                addMessage('Системы онлайн. Я Векта. Готова к работе.', 'ai', false);
                return;
            }
            chat.messages.forEach(msg => {
                addMessage(msg.text, msg.sender, false);
            });
        }

        function addMessage(text, sender, save = true) {
            const msg = document.createElement('div');
            msg.classList.add('message', sender);
            msg.textContent = text;
            chatHistory.appendChild(msg);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            
            if (save) {
                const chat = getCurrentChat();
                if (chat) {
                    chat.messages.push({ sender, text, time: new Date().toISOString() });
                    saveState();
                    if (chat.messages.length === 1 && sender === 'user') {
                        chat.name = text.substring(0, 30) + (text.length > 30 ? '...' : '');
                        saveState();
                        renderChatsList();
                        currentChatTitle.textContent = chat.name;
                    }
                }
            }
        }

        function deleteChat(chatId) {
            if (state.chats.length <= 1) {
                alert('Нельзя удалить последний чат');
                return;
            }
            if (!confirm('Удалить этот чат?')) return;
            state.chats = state.chats.filter(c => c.id !== chatId);
            if (state.currentChatId === chatId) {
                state.currentChatId = state.chats[0].id;
            }
            saveState();
            renderChatsList();
            switchChat(state.currentChatId);
        }

        function openRenameModal(chatId) {
            const chat = state.chats.find(c => c.id === chatId);
            if (!chat) return;
            
            modalContent.innerHTML = `
                <h3>Переименовать чат</h3>
                <input type="text" id="renameInput" value="${escapeHtml(chat.name)}">
                <div style="margin-bottom:15px">
                    <label style="font-size:12px;color:var(--primary-color)">Группа:</label>
                    <select id="groupSelect">
                        ${state.groups.map(g => `<option value="${g.id}" ${g.id === chat.group ? 'selected' : ''}>${escapeHtml(g.name)}</option>`).join('')}
                    </select>
                </div>
                <div class="modal-actions">
                    <button class="modal-btn secondary" id="modalCancel">Отмена</button>
                    <button class="modal-btn primary" id="modalSave">Сохранить</button>
                </div>
            `;
            modalOverlay.classList.add('active');
            
            document.getElementById('modalCancel').onclick = closeModal;
            document.getElementById('modalSave').onclick = () => {
                const newName = document.getElementById('renameInput').value.trim();
                const newGroup = document.getElementById('groupSelect').value;
                if (newName) {
                    chat.name = newName;
                    chat.group = newGroup;
                    saveState();
                    renderChatsList();
                    if (chat.id === state.currentChatId) {
                        currentChatTitle.textContent = chat.name;
                    }
                }
                closeModal();
            };
            document.getElementById('renameInput').focus();
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ====== ЭМОЦИИ ======
        function setEmotion(emotion) {
            robot.className.baseVal = 'robot';
            if (emotion) robot.classList.add(emotion);
        }

        setInterval(() => {
            if (!isProcessing && Math.random() > 0.6) {
                setEmotion('blink');
                setTimeout(() => setEmotion(null), 200);
            }
        }, 3500);

        function detectEmotion(text) {
            const lower = text.toLowerCase();
            if (lower.includes('люблю') || lower.includes('нравится') || lower.includes('❤')) return 'love';
            if (lower.includes('рад') || lower.includes('отлично') || lower.includes('хорошо') || lower.includes('привет')) return 'happy';
            if (lower.includes('груст') || lower.includes('жаль') || lower.includes('плохо')) return 'sad';
            if (lower.includes('злюсь') || lower.includes('бесит') || lower.includes('ошибка')) return 'angry';
            if (lower.includes('удив') || lower.includes('вау') || lower.includes('ого')) return 'surprised';
            if (lower.includes('устал') || lower.includes('сон') || lower.includes('поздно')) return 'sleepy';
            if (lower.includes('не знаю') || lower.includes('не понял') || lower.includes('странно')) return 'confused';
            if (lower.includes('круто') || lower.includes('класс') || lower.includes('ура')) return 'excited';
            if (lower.includes('боюсь') || lower.includes('страш')) return 'scared';
            if (lower.includes('крут') || lower.includes('спокойно')) return 'cool';
            return 'happy';
        }

        // ====== ОТПРАВКА СООБЩЕНИЙ ======
        function showTyping(show) {
            typingIndicator.style.display = show ? 'block' : 'none';
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage(text) {
            if (!text) text = userInput.value.trim();
            if (!text || isProcessing) return;

            isProcessing = true;
            sendBtn.disabled = true;
            
            addMessage(text, 'user');
            userInput.value = '';
            
            setEmotion('surprised');
            showTyping(true);

            try {
                const response = await fetch(`${BACKEND_URL}/api/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: 'user', text: text })
                });

                const data = await response.json();
                
                const emotion = detectEmotion(data.ai_response);
                setEmotion(emotion);
                showTyping(false);
                addMessage(data.ai_response, 'ai');
                
                setTimeout(() => {
                    if (!isProcessing) setEmotion(null);
                }, 3000);

            } catch (error) {
                showTyping(false);
                setEmotion('angry');
                addMessage('Ошибка связи с сервером.', 'ai');
                setTimeout(() => setEmotion(null), 2000);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // ====== ГОЛОСОВОЙ ВВОД ======
        let recognition = null;
        let isRecording = false;

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                micBtn.style.display = 'none';
                console.log('Голосовой ввод не поддерживается в этом браузере');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = true;
            recognition.continuous = false;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                userInput.placeholder = 'Говорите...';
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                userInput.value = transcript;
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.classList.remove('recording');
                userInput.placeholder = 'Команда...';
                if (userInput.value.trim()) {
                    setTimeout(() => sendMessage(), 300);
                }
            };

            recognition.onerror = (event) => {
                console.error('Ошибка распознавания:', event.error);
                isRecording = false;
                micBtn.classList.remove('recording');
                userInput.placeholder = 'Команда...';
                if (event.error === 'not-allowed') {
                    alert('Доступ к микрофону запрещён. Разрешите доступ в настройках браузера.');
                }
            };
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) {
                alert('Голосовой ввод не поддерживается в вашем браузере. Используйте Chrome или Edge.');
                return;
            }
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        // ====== СОБЫТИЯ ======
        sendBtn.addEventListener('click', () => sendMessage());
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        
        document.getElementById('btnNewChat').addEventListener('click', () => {
            const chat = createNewChat();
            renderChatsList();
            switchChat(chat.id);
        });

        document.getElementById('btnToggleSidebar').addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // ====== ИНИЦИАЛИЗАЦИЯ ======
        loadState();
        initSpeechRecognition();
        renderChatsList();
        renderMessages();
        const chat = getCurrentChat();
        if (chat) currentChatTitle.textContent = chat.name;
        userInput.focus();
    </script>
</body>
</html>
