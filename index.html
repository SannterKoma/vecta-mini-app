<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vecta AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --sidebar-bg: #0f1117;
            --primary-color: #00f3ff;
            --purple-accent: #9d4edd;
            --text-color: #e0e0e0;
            --glass-bg: rgba(0, 243, 255, 0.08);
            --user-msg-bg: rgba(0, 243, 255, 0.2);
            --border-color: rgba(0, 243, 255, 0.15);
            --mic-active: #ff4757;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(ellipse at top, rgba(157, 78, 221, 0.15) 0%, var(--bg-color) 60%);
        }

        /* --- БОКОВАЯ ПАНЕЛЬ --- */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-new-chat {
            background: var(--primary-color);
            color: var(--bg-color);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-new-chat:hover {
            box-shadow: 0 0 15px var(--primary-color);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .group-title {
            font-size: 11px;
            color: var(--purple-accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 10px 8px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-add-group {
            background: none;
            border: 1px solid var(--purple-accent);
            color: var(--purple-accent);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 0;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            margin-bottom: 2px;
            border: 1px solid transparent;
        }

        .chat-item:hover {
            background: rgba(0, 243, 255, 0.05);
            border-color: var(--border-color);
        }

        .chat-item.active {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--primary-color);
        }

        .chat-item-name {
            flex: 1;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item-actions {
            display: none;
            gap: 4px;
        }

        .chat-item:hover .chat-item-actions {
            display: flex;
        }

        .chat-action-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 5px;
            opacity: 0.6;
            transition: 0.2s;
        }

        .chat-action-btn:hover {
            opacity: 1;
            color: var(--primary-color);
        }

        .chat-action-btn.delete:hover {
            color: #ff4757;
        }

        /* --- ОСНОВНАЯ ОБЛАСТЬ --- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .top-bar {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 17, 23, 0.8);
        }

        .btn-toggle-sidebar {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            display: none;
        }

        .current-chat-title {
            font-size: 16px;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* --- РОБОТ --- */
        .robot-container {
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            background: radial-gradient(ellipse at center bottom, rgba(157, 78, 221, 0.1) 0%, transparent 70%);
        }

        svg.robot {
            width: 160px;
            height: 180px;
            filter: drop-shadow(0 0 25px rgba(0, 243, 255, 0.3));
        }

        .eye-glow { animation: eye-pulse 2s ease-in-out infinite; }
        @keyframes eye-pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .tear { opacity: 0; transition: opacity 0.3s; }
        .sparkle { opacity: 0; animation: sparkle-anim 1.5s infinite; }
        @keyframes sparkle-anim {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Эмоции */
        .robot.happy .eye-left { d: path("M 55 95 Q 65 85 75 95"); }
        .robot.happy .eye-right { d: path("M 105 95 Q 115 85 125 95"); }
        .robot.sad .eye-left { d: path("M 55 105 Q 65 115 75 105"); }
        .robot.sad .eye-right { d: path("M 105 105 Q 115 115 125 105"); }
        .robot.sad .tear { opacity: 1; }
        .robot.angry .eye-left { d: path("M 50 100 L 75 92 L 78 102 Z"); }
        .robot.angry .eye-right { d: path("M 130 100 L 105 92 L 102 102 Z"); }
        .robot.surprised .eye-left { d: path("M 60 88 A 10 10 0 1 0 80 108 A 10 10 0 1 0 60 88"); }
        .robot.surprised .eye-right { d: path("M 110 88 A 10 10 0 1 0 130 108 A 10 10 0 1 0 110 88"); }
        .robot.sleepy .eye-left { d: path("M 55 100 L 75 100"); stroke-width: 6; }
        .robot.sleepy .eye-right { d: path("M 105 100 L 125 100"); stroke-width: 6; }
        .robot.love .eye-left { d: path("M 65 92 C 65 87, 57 87, 57 94 C 57 101, 65 106, 65 106 C 65 106, 73 101, 73 94 C 73 87, 65 87, 65 92"); }
        .robot.love .eye-right { d: path("M 115 92 C 115 87, 107 87, 107 94 C 107 101, 115 106, 115 106 C 115 106, 123 101, 123 94 C 123 87, 115 87, 115 92"); }
        .robot.confused .eye-left { d: path("M 58 88 A 8 10 0 1 0 74 108 A 8 10 0 1 0 58 88"); }
        .robot.confused .eye-right { d: path("M 108 94 A 10 8 0 1 0 128 110 A 10 8 0 1 0 108 94"); }
        .robot.excited .eye-left { d: path("M 65 85 L 68 95 L 78 95 L 70 101 L 73 111 L 65 105 L 57 111 L 60 101 L 52 95 L 62 95 Z"); }
        .robot.excited .eye-right { d: path("M 115 85 L 118 95 L 128 95 L 120 101 L 123 111 L 115 105 L 107 111 L 110 101 L 102 95 L 112 95 Z"); }
        .robot.scared .eye-left { d: path("M 58 88 A 12 12 0 1 0 82 112 A 12 12 0 1 0 58 88"); }
        .robot.scared .eye-right { d: path("M 108 88 A 12 12 0 1 0 132 112 A 12 12 0 1 0 108 88"); }
        .robot.cool .eye-left { d: path("M 55 100 L 78 100 L 75 106 L 58 106 Z"); }
        .robot.cool .eye-right { d: path("M 102 100 L 125 100 L 122 106 L 105 106 Z"); }
        .robot.blink .eye-shape { transform: scaleY(0.1); transform-origin: center; }

        /* --- ЧАТ --- */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 85%;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            animation: popIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            border: 1px solid rgba(0, 243, 255, 0.4);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 2px;
        }

        /* Индикатор печати — ПО ЦЕНТРУ */
        .typing-indicator {
            display: none;
            align-self: center;
            background: var(--glass-bg);
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            margin: 5px 0;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1.4s infinite ease-in-out both;
            box-shadow: 0 0 8px var(--primary-color);
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* --- ПАНЕЛЬ ВВОДА --- */
        .input-panel {
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            background: rgba(11, 12, 16, 0.95);
            border-top: 1px solid var(--border-color);
            align-items: center;
        }

        .input-panel input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 20px;
            padding: 10px 18px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            outline: none;
        }

        .input-panel input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--primary-color);
            color: var(--bg-color);
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn:active { transform: scale(0.9); }
        .btn:disabled { opacity: 0.5; }

        .btn-mic {
            background: rgba(0, 243, 255, 0.15);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .btn-mic.recording {
            background: var(--mic-active);
            color: white;
            border-color: var(--mic-active);
            animation: mic-pulse 1s infinite;
        }

        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--sidebar-bg);
            border: 1px solid var(--primary-color);
            border-radius: 12px;
            padding: 20px;
            min-width: 300px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
        }

        .modal h3 {
            margin: 0 0 15px;
            color: var(--primary-color);
        }

        .modal input, .modal select {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }

        .modal input:focus { border-color: var(--primary-color); }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
        }

        .modal-btn.primary {
            background: var(--primary-color);
            color: var(--bg-color);
        }

        .modal-btn.secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .btn-toggle-sidebar { display: block; }
        }
    </style>
</head>
<body>

    <!-- БОКОВАЯ ПАНЕЛЬ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Vecta</h2>
            <button class="btn-new-chat" id="btnNewChat">+ Новый</button>
        </div>
        <div class="chats-list" id="chatsList"></div>
    </aside>

    <!-- ОСНОВНАЯ ОБЛАСТЬ -->
    <main class="main">
        <div class="top-bar">
            <button class="btn-toggle-sidebar" id="btnToggleSidebar">☰</button>
            <div class="current-chat-title" id="currentChatTitle">Новый чат</div>
        </div>

        <div class="robot-container">
            <svg class="robot" id="vectaRobot" viewBox="0 0 180 200">
                <defs>
                    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#2a2a3e"/>
                        <stop offset="50%" style="stop-color:#1a1a2e"/>
                        <stop offset="100%" style="stop-color:#0f0f1a"/>
                    </linearGradient>
                    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#0a0a0a"/>
                        <stop offset="100%" style="stop-color:#000000"/>
                    </linearGradient>
                    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#3a3a4e"/>
                        <stop offset="100%" style="stop-color:#1a1a2e"/>
                    </linearGradient>
                    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#1a1a2e"/>
                        <stop offset="50%" style="stop-color:#2a2a3e"/>
                        <stop offset="100%" style="stop-color:#1a1a2e"/>
                    </linearGradient>
                    <filter id="neonGlow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="strongGlow">
                        <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
                        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>
                
                <ellipse cx="90" cy="185" rx="55" ry="12" fill="url(#baseGrad)" stroke="#00f3ff" stroke-width="1" opacity="0.8"/>
                <ellipse cx="90" cy="183" rx="50" ry="10" fill="none" stroke="#9d4edd" stroke-width="2" filter="url(#neonGlow)"/>
                <ellipse cx="90" cy="183" rx="45" ry="8" fill="none" stroke="#00f3ff" stroke-width="1" opacity="0.6"/>
                
                <rect x="75" y="165" width="30" height="20" rx="5" fill="url(#headGrad)" stroke="#00f3ff" stroke-width="1" opacity="0.7"/>
                
                <rect x="40" y="60" width="100" height="110" rx="20" fill="url(#headGrad)" stroke="#9d4edd" stroke-width="2"/>
                <rect x="42" y="62" width="96" height="106" rx="18" fill="none" stroke="#00f3ff" stroke-width="1" opacity="0.5"/>
                
                <rect x="50" y="70" width="80" height="80" rx="15" fill="url(#screenGrad)" stroke="#00f3ff" stroke-width="1.5"/>
                <rect x="52" y="72" width="76" height="76" rx="13" fill="none" stroke="#9d4edd" stroke-width="0.5" opacity="0.6"/>
                <ellipse cx="70" cy="85" rx="15" ry="8" fill="white" opacity="0.08"/>
                
                <path d="M 35 90 Q 35 40 90 40 Q 145 40 145 90" fill="none" stroke="url(#headphoneGrad)" stroke-width="12" stroke-linecap="round"/>
                <path d="M 35 90 Q 35 40 90 40 Q 145 40 145 90" fill="none" stroke="#9d4edd" stroke-width="2" opacity="0.8" filter="url(#neonGlow)"/>
                
                <rect x="20" y="85" width="20" height="35" rx="8" fill="url(#headphoneGrad)" stroke="#9d4edd" stroke-width="2"/>
                <rect x="22" y="87" width="16" height="31" rx="6" fill="none" stroke="#00f3ff" stroke-width="1" opacity="0.7"/>
                <circle cx="30" cy="102" r="5" fill="#00f3ff" opacity="0.3" filter="url(#neonGlow)"/>
                
                <rect x="140" y="85" width="20" height="35" rx="8" fill="url(#headphoneGrad)" stroke="#9d4edd" stroke-width="2"/>
                <rect x="142" y="87" width="16" height="31" rx="6" fill="none" stroke="#00f3ff" stroke-width="1" opacity="0.7"/>
                <circle cx="150" cy="102" r="5" fill="#00f3ff" opacity="0.3" filter="url(#neonGlow)"/>
                
                <line x1="50" y1="155" x2="70" y2="155" stroke="#00f3ff" stroke-width="2" filter="url(#neonGlow)"/>
                <line x1="110" y1="155" x2="130" y2="155" stroke="#00f3ff" stroke-width="2" filter="url(#neonGlow)"/>
                <line x1="90" y1="150" x2="90" y2="160" stroke="#9d4edd" stroke-width="2" filter="url(#neonGlow)"/>
                
                <g class="eye-glow">
                    <path class="eye-shape eye-left" d="M 60 95 A 12 12 0 1 0 84 119 A 12 12 0 1 0 60 95" fill="#00f3ff" filter="url(#strongGlow)"/>
                    <path class="eye-shape eye-right" d="M 96 95 A 12 12 0 1 0 120 119 A 12 12 0 1 0 96 95" fill="#00f3ff" filter="url(#strongGlow)"/>
                </g>
                
                <path class="tear" d="M 75 120 Q 73 130 75 135 Q 77 130 75 120" fill="#00f3ff" filter="url(#neonGlow)"/>
                
                <circle class="sparkle" cx="50" cy="85" r="3" fill="white"/>
                <circle class="sparkle" cx="130" cy="85" r="3" fill="white"/>
                <circle class="sparkle" cx="90" cy="75" r="2" fill="white"/>
            </svg>
        </div>

        <div class="chat-history" id="chatHistory">
            <div class="message ai">Системы онлайн. Я Векта. Готова к работе.</div>
        </div>

        <!-- Индикатор печати внутри chat-history для центрирования -->
        <div class="typing-indicator" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>

        <div class="input-panel">
            <input type="text" id="userInput" placeholder="Команда..." autocomplete="off">
            <button class="btn btn-mic" id="micBtn" title="Голосовой ввод">🎤</button>
            <button class="btn" id="sendBtn"></button>
        </div>
    </main>

    <!-- МОДАЛКИ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <script>
        // ====== ХРАНИЛИЩЕ ======
        const STORAGE_KEY = 'vecta_chats_v1';
        
        let state = {
            chats: [],
            groups: [{ id: 'default', name: 'Общие' }],
            currentChatId: null
        };

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                state = JSON.parse(saved);
            }
            if (!state.currentChatId || !state.chats.find(c => c.id === state.currentChatId)) {
                createNewChat('Новый чат');
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function createNewChat(name = 'Новый чат', groupId = 'default') {
            const chat = {
                id: 'chat_' + Date.now(),
                name: name,
                group: groupId,
                messages: [],
                created: new Date().toISOString()
            };
            state.chats.push(chat);
            state.currentChatId = chat.id;
            saveState();
            return chat;
        }

        function getCurrentChat() {
            return state.chats.find(c => c.id === state.currentChatId);
        }

        // ====== UI ======
        const chatHistory = document.getElementById('chatHistory');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const robot = document.getElementById('vectaRobot');
        const typingIndicator = document.getElementById('typingIndicator');
        const chatsList = document.getElementById('chatsList');
        const currentChatTitle = document.getElementById('currentChatTitle');
        const sidebar = document.getElementById('sidebar');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');

        const BACKEND_URL = 'http://localhost:8000';
        let isProcessing = false;

        function renderChatsList() {
            chatsList.innerHTML = '';
            
            state.groups.forEach(group => {
                const groupChats = state.chats.filter(c => c.group === group.id);
                if (groupChats.length === 0) return;
                
                const groupEl = document.createElement('div');
                groupEl.className = 'group-title';
                groupEl.innerHTML = `
                    <span>${group.name}</span>
                    <button class="btn-add-group" data-group="${group.id}" title="Новый чат в группе">+</button>
                `;
                chatsList.appendChild(groupEl);
                
                groupChats.forEach(chat => {
                    const item = document.createElement('div');
                    item.className = 'chat-item' + (chat.id === state.currentChatId ? ' active' : '');
                    item.innerHTML = `
                        <span class="chat-item-name">${escapeHtml(chat.name)}</span>
                        <div class="chat-item-actions">
                            <button class="chat-action-btn rename" data-id="${chat.id}" title="Переименовать">✎</button>
                            <button class="chat-action-btn delete" data-id="${chat.id}" title="Удалить">✕</button>
                        </div>
                    `;
                    item.addEventListener('click', (e) => {
                        if (e.target.closest('.chat-action-btn')) return;
                        switchChat(chat.id);
                    });
                    chatsList.appendChild(item);
                });
            });

            document.querySelectorAll('.btn-add-group').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const groupId = btn.dataset.group;
                    const chat = createNewChat('Новый чат', groupId);
                    renderChatsList();
                    switchChat(chat.id);
                });
            });

            document.querySelectorAll('.chat-action-btn.rename').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openRenameModal(btn.dataset.id);
                });
            });

            document.querySelectorAll('.chat-action-btn.delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteChat(btn.dataset.id);
                });
            });
        }

        function switchChat(chatId) {
            state.currentChatId = chatId;
            saveState();
            renderChatsList();
            renderMessages();
            const chat = getCurrentChat();
            currentChatTitle.textContent = chat ? chat.name : 'Новый чат';
            if (window.innerWidth <= 768) sidebar.classList.remove('open');
        }

        function renderMessages() {
            chatHistory.innerHTML = '';
            const chat = getCurrentChat();
            if (!chat || chat.messages.length === 0) {
                addMessage('Системы онлайн. Я Векта. Готова к работе.', 'ai', false);
                return;
            }
            chat.messages.forEach(msg => {
                addMessage(msg.text, msg.sender, false);
            });
        }

        function addMessage(text, sender, save = true) {
            const msg = document.createElement('div');
            msg.classList.add('message', sender);
            msg.textContent = text;
            chatHistory.appendChild(msg);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            
            if (save) {
                const chat = getCurrentChat();
                if (chat) {
                    chat.messages.push({ sender, text, time: new Date().toISOString() });
                    saveState();
                    if (chat.messages.length === 1 && sender === 'user') {
                        chat.name = text.substring(0, 30) + (text.length > 30 ? '...' : '');
                        saveState();
                        renderChatsList();
                        currentChatTitle.textContent = chat.name;
                    }
                }
            }
        }

        function deleteChat(chatId) {
            if (state.chats.length <= 1) {
                alert('Нельзя удалить последний чат');
                return;
            }
            if (!confirm('Удалить этот чат?')) return;
            state.chats = state.chats.filter(c => c.id !== chatId);
            if (state.currentChatId === chatId) {
                state.currentChatId = state.chats[0].id;
            }
            saveState();
            renderChatsList();
            switchChat(state.currentChatId);
        }

        function openRenameModal(chatId) {
            const chat = state.chats.find(c => c.id === chatId);
            if (!chat) return;
            
            modalContent.innerHTML = `
                <h3>Переименовать чат</h3>
                <input type="text" id="renameInput" value="${escapeHtml(chat.name)}">
                <div style="margin-bottom:15px">
                    <label style="font-size:12px;color:var(--purple-accent)">Группа:</label>
                    <select id="groupSelect">
                        ${state.groups.map(g => `<option value="${g.id}" ${g.id === chat.group ? 'selected' : ''}>${escapeHtml(g.name)}</option>`).join('')}
                    </select>
                </div>
                <div class="modal-actions">
                    <button class="modal-btn secondary" id="modalCancel">Отмена</button>
                    <button class="modal-btn primary" id="modalSave">Сохранить</button>
                </div>
            `;
            modalOverlay.classList.add('active');
            
            document.getElementById('modalCancel').onclick = closeModal;
            document.getElementById('modalSave').onclick = () => {
                const newName = document.getElementById('renameInput').value.trim();
                const newGroup = document.getElementById('groupSelect').value;
                if (newName) {
                    chat.name = newName;
                    chat.group = newGroup;
                    saveState();
                    renderChatsList();
                    if (chat.id === state.currentChatId) {
                        currentChatTitle.textContent = chat.name;
                    }
                }
                closeModal();
            };
            document.getElementById('renameInput').focus();
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ====== ЭМОЦИИ ======
        function setEmotion(emotion) {
            robot.className.baseVal = 'robot';
            if (emotion) robot.classList.add(emotion);
        }

        setInterval(() => {
            if (!isProcessing && Math.random() > 0.6) {
                setEmotion('blink');
                setTimeout(() => setEmotion(null), 200);
            }
        }, 3500);

        function detectEmotion(text) {
            const lower = text.toLowerCase();
            if (lower.includes('люблю') || lower.includes('нравится') || lower.includes('❤')) return 'love';
            if (lower.includes('рад') || lower.includes('отлично') || lower.includes('хорошо') || lower.includes('привет')) return 'happy';
            if (lower.includes('груст') || lower.includes('жаль') || lower.includes('плохо')) return 'sad';
            if (lower.includes('злюсь') || lower.includes('бесит') || lower.includes('ошибка')) return 'angry';
            if (lower.includes('удив') || lower.includes('вау') || lower.includes('ого')) return 'surprised';
            if (lower.includes('устал') || lower.includes('сон') || lower.includes('поздно')) return 'sleepy';
            if (lower.includes('не знаю') || lower.includes('не понял') || lower.includes('странно')) return 'confused';
            if (lower.includes('круто') || lower.includes('класс') || lower.includes('ура')) return 'excited';
            if (lower.includes('боюсь') || lower.includes('страш')) return 'scared';
            if (lower.includes('крут') || lower.includes('спокойно')) return 'cool';
            return 'happy';
        }

        // ====== ОТПРАВКА СООБЩЕНИЙ ======
        function showTyping(show) {
            typingIndicator.style.display = show ? 'block' : 'none';
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage(text) {
            if (!text) text = userInput.value.trim();
            if (!text || isProcessing) return;

            isProcessing = true;
            sendBtn.disabled = true;
            
            addMessage(text, 'user');
            userInput.value = '';
            
            setEmotion('surprised');
            showTyping(true);

            try {
                const response = await fetch(`${BACKEND_URL}/api/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: 'user', text: text })
                });

                const data = await response.json();
                
                const emotion = detectEmotion(data.ai_response);
                setEmotion(emotion);
                showTyping(false);
                addMessage(data.ai_response, 'ai');
                
                setTimeout(() => {
                    if (!isProcessing) setEmotion(null);
                }, 3000);

            } catch (error) {
                showTyping(false);
                setEmotion('angry');
                addMessage('Ошибка связи с сервером.', 'ai');
                setTimeout(() => setEmotion(null), 2000);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // ====== ГОЛОСОВОЙ ВВОД ======
        let recognition = null;
        let isRecording = false;

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                micBtn.style.display = 'none';
                console.log('Голосовой ввод не поддерживается в этом браузере');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = true;
            recognition.continuous = false;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                userInput.placeholder = '🎤 Говорите...';
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                userInput.value = transcript;
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.classList.remove('recording');
                userInput.placeholder = 'Команда...';
                // Автоматическая отправка, если есть текст
                if (userInput.value.trim()) {
                    setTimeout(() => sendMessage(), 300);
                }
            };

            recognition.onerror = (event) => {
                console.error('Ошибка распознавания:', event.error);
                isRecording = false;
                micBtn.classList.remove('recording');
                userInput.placeholder = 'Команда...';
                if (event.error === 'not-allowed') {
                    alert('Доступ к микрофону запрещён. Разрешите доступ в настройках браузера.');
                }
            };
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) {
                alert('Голосовой ввод не поддерживается в вашем браузере. Используйте Chrome или Edge.');
                return;
            }
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        // ====== СОБЫТИЯ ======
        sendBtn.addEventListener('click', () => sendMessage());
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        
        document.getElementById('btnNewChat').addEventListener('click', () => {
            const chat = createNewChat();
            renderChatsList();
            switchChat(chat.id);
        });

        document.getElementById('btnToggleSidebar').addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // ====== ИНИЦИАЛИЗАЦИЯ ======
        loadState();
        initSpeechRecognition();
        renderChatsList();
        renderMessages();
        const chat = getCurrentChat();
        if (chat) currentChatTitle.textContent = chat.name;
        userInput.focus();
    </script>
</body>
</html>
